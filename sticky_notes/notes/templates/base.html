{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sticky Notes{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <!-- Custom CSS (loaded after Bootstrap so it can override it) -->
    <link rel="stylesheet" href="{% static 'notes/css/styles.css' %}">
</head>
<body>
    <!-- Navigation bar, shown on every page -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'note_list' %}">Sticky Notes</a>
            <a class="btn btn-warning" href="{% url 'note_create' %}">+ New note</a>
        </div>
    </nav>

    <!-- Each page fills in this block with its own content -->
     <main class="container mb-5">
        {% block content %}{% endblock %}
     </main>
</body>
</html>
